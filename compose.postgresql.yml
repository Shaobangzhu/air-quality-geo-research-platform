name: air-quality-geo-research-platform

services:
  postgresql:
    image: postgres:18.6-bookworm
    container_name: air-quality-geo-research-platform-postgresql
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRESQL_PORT:-55436}:5432'
    environment:
      POSTGRES_USER: aq_workbench_admin
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgresql-admin-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets:
      - postgresql-admin-password
    volumes:
      # PostgreSQL 18 stores its versioned PGDATA beneath this mount.
      - postgresql-data:/var/lib/postgresql
    networks:
      - postgresql-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U aq_workbench_admin -d postgres
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    labels:
      io.air-quality.project: air-quality-geo-research-platform

volumes:
  postgresql-data:
    name: air-quality-geo-research-platform-postgresql-data

networks:
  postgresql-network:
    name: air-quality-geo-research-platform-postgresql-network
    driver: bridge

secrets:
  postgresql-admin-password:
    file: ./.local/postgresql/admin-password
